# evader_s1_obstacle_20260409_v12_wallfix.yaml
# Stage1-A v12: wall and goal stabilization from v11 warm-start.
#
# Intended run:
#   --run-id=evader_s1_obstacle_44d_v12wallfix_seed42
#   --initialize-from=evader_s1_obstacle_44d_v11dewall_seed42
#
# Notes:
# - Keep architecture unchanged (44D vector + ray)
# - Slightly conservative updates vs v11 for smoother adaptation
# - Use notebook train_v12/resume_v12 workflow

engine_settings:
  time_scale: 20
  capture_frame_rate: 60

behaviors:
  Drone_Evader:
    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 24576
      learning_rate: 1.2e-4
      beta: 2.5e-3
      epsilon: 0.12
      lambd: 0.99
      num_epoch: 2
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 1000000
    time_horizon: 128
    summary_freq: 5000
    checkpoint_interval: 25000
    keep_checkpoints: 8
