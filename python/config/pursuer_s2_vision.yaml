# pursuer_s2_vision.yaml
# Stage0_Flat_Pursuer:
#   - Evader: fixed inference policy (v5), goal-directed baseline
#   - Pursuer: train with all available sensors enabled
#       1) Vector observation (PursuerAgent state + camera-guided target features)
#       2) DroneSensorSystem 26-ray distances
#       3) DroneRGB visual observation (84x84 grayscale)
#       4) DroneDepth visual observation (84x84 grayscale)
#
# Unity Inspector prerequisites:
#   Stage0_Flat_Pursuer.unity
#   - Drone_Evader: Behavior Type = Inference Only, Model = evader_s0_flat_44d_v5.onnx
#   - Drone_Evader: Use Child Sensors = false
#   - Drone_Pursuer: Behavior Name = Drone_Pursuer
#   - Drone_Pursuer: Behavior Type = Default, Model = None
#   - Drone_Pursuer: Use Child Sensors = true
#   - DroneVisionSystem.enableVisualObservation = true
#   - DroneDepthSystem.enableDepthSensor       = true
#   - DroneRGB / DroneDepth RenderTextureSensorComponent: grayscale = true
#
# Run:
#   mlagents-learn python/config/pursuer_s2_vision.yaml \
#     --run-id=pursuer_s2_allsensors_seed42 --force

behaviors:
  Drone_Pursuer:
    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 12800
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 1000000
    time_horizon: 64
    summary_freq: 10000
    checkpoint_interval: 100000
    keep_checkpoints: 5

# Notes
# - This config intentionally mixes vector + two grayscale visual sensors.
# - If training is unstable, reduce learning_rate to 1.0e-4 first.
# - If GPU memory is tight, reduce batch_size to 64 before changing image size.
