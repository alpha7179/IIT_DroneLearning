# evader_s1_obstacle_template.yaml
# Stage1-A v4: Clean restart from Stage0 warm-start
# Goal: Mean Reward > +1.0 within 100k steps
#
# WHY v4: v1-v3 warm-start encoded "avoid goal" bias (proximity penalty fired
# on Goal collider -> drone learned goal zone = obstacle). Discarded.
# Stage0 v6 warm-start: knows goal-seeking, no city obstacle bias.
#
# CURRICULUM:
#   Phase1 (v4): SpawnCenter radius=12m  -> max spawn-goal dist ~24m
#   Phase2 (v5): SpawnCenter radius=25m  -> after Phase1 converges
#   Phase3 (v6): full city range (CityMetadata strategy)
#
# Unity Inspector (Stage1.unity):
#   EpisodeSpawnCoordinator:
#     Strategy        = SpawnCenterRandom
#     _minSeparation  = 3
#   SpawnCenter:
#     Auto Sync From City = OFF
#     Sync Mode       = Synchronized
#     Shared Range -> Radius = 12
#   EvaderAgent:
#     _goalOnlyMode          = true
#     _currentStage          = 1
#     Max Episode Seconds    = 25
#     _checkpointCount       = 2
#     _checkpointRadius      = 4.0
#     _checkpointReward      = 0.3
#     _checkpointClearRadius = 2.0
#   EvaderReward:
#     _goalShapingCoeff      = 0.3
#     _velAlignCoeff         = 0.02
#     _goalPriorityDist      = 6.0
#     _timePenaltyPerStep    = -0.001
#     _proximityCoeff        = 0.002
#     _proximityThreshold    = 0.15
#
# Run:
#   mlagents-learn python/config/evader_s1_obstacle_template.yaml \
#     --run-id=evader_s1_obstacle_44d_v4_seed42 \
#     --initialize-from=evader_s0_flat_44d_v6_seed42 \
#     --force
#
# Phase1 -> Phase2: Mean Reward > +1.0 sustained 3x50k intervals

engine_settings:
  time_scale: 20
  capture_frame_rate: 60

behaviors:
  Drone_Evader:
    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 20480
      learning_rate: 2.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000
    keep_checkpoints: 5
