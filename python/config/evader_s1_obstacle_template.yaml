# evader_s1_obstacle_template.yaml
# Stage1-A: Obstacle env, no Pursuer (_goalOnlyMode=true, _currentStage=1)
# Goal: goal_reach_rate >= 30%, crash_rate <= 15%
#
# Unity Inspector (Stage1.unity > Drone_Evader):
#   EvaderAgent:
#     _goalOnlyMode          = true
#     _currentStage          = 1
#     Max Episode Seconds    = 35
#     _checkpointCount       = 2
#     _checkpointRadius      = 4.0
#     _checkpointReward      = 0.3
#     _checkpointClearRadius = 2.0
#   EvaderReward:
#     _goalShapingCoeff      = 0.3
#     _velAlignCoeff         = 0.005  (obstacle-aware: blends goal-dir and repulsion)
#     _yawAlignCoeff         = 0.0
#     _proximityThreshold    = 0.15
#     _proximityCoeff        = 0.002
#     _heightWarningY        = 17
#     _heightPenaltyCoeff    = -0.02
#     _timePenaltyPerStep    = -0.003
#   BehaviorParameters:
#     Behavior Name = Drone_Evader
#   DroneDepthSystem: DISABLED / DroneVisionSystem: ENABLED (RGB 3ch)
#
# Run (warm-start from v1 best checkpoint):
#   mlagents-learn python/config/evader_s1_obstacle_template.yaml \
#     --run-id=evader_s1_obstacle_44d_v2_seed42 \
#     --initialize-from=evader_s1_obstacle_44d_v1_seed42 \
#     --force

engine_settings:
  time_scale: 20
  capture_frame_rate: 60

behaviors:
  Drone_Evader:
    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 20480
      learning_rate: 2.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000
    keep_checkpoints: 5
