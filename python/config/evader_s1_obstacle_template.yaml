# evader_s1_obstacle_template.yaml
# Stage1-A v5: Resume from v1-500k (has wall avoidance) + Goal on Ignore Raycast
# Goal: Mean Reward > +1.0 within 200k steps
#
# WHY v5: v4 (Stage0 warm-start) had zero obstacle knowledge -> constant crashes.
# v1-500k knows wall avoidance AND some goal-reaching (peak +2.669 at 340k).
# CRITICAL FIX: Goal GameObject moved to "Ignore Raycast" layer ->
#   proximity penalty no longer fires on Goal collider -> goal-avoidance bias gone.
#
# CURRICULUM:
#   Phase1 (v5): SpawnCenter radius=12m  -> max spawn-goal dist ~24m
#   Phase2 (v6): SpawnCenter radius=25m  -> after Phase1 converges
#   Phase3 (v7): full city range (CityMetadata strategy)
#
# Unity Inspector (Stage1.unity):
#   EpisodeSpawnCoordinator:
#     Strategy        = SpawnCenterRandom
#     _minSeparation  = 3
#   SpawnCenter:
#     Auto Sync From City = OFF
#     Sync Mode       = Synchronized
#     Shared Range -> Radius = 12
#   Goal:
#     Layer           = Ignore Raycast  *** REQUIRED - sensors must not see goal ***
#   EvaderAgent:
#     _goalOnlyMode          = true
#     _currentStage          = 1
#     Max Episode Seconds    = 40
#     _goalArrivalReward     = 3.0
#     _checkpointCount       = 2
#     _checkpointRadius      = 4.0
#     _checkpointReward      = 0.10
#     _checkpointClearRadius = 2.0
#   EvaderReward:
#     _goalShapingCoeff      = 0.3
#     _velAlignCoeff         = 0.012   # reduced: less goal-rush, allow obstacle detour
#     _goalPriorityDist      = 6.0
#     _timePenaltyPerStep    = -0.001  # keep light: large map needs longer exploration
#     _proximityCoeff        = 0.006   # 3x stronger: clear wall-avoidance signal
#     _proximityThreshold    = 0.25    # wider: detect walls earlier
#
# Run:
#   mlagents-learn python/config/evader_s1_obstacle_template.yaml \
#     --run-id=evader_s1_obstacle_44d_v5_seed42 \
#     --initialize-from=evader_s1_obstacle_44d_v1_seed42 \
#     --force
#
# Phase1 -> Phase2: Mean Reward > +1.0 sustained 3x50k intervals

engine_settings:
  time_scale: 20
  capture_frame_rate: 60

behaviors:
  Drone_Evader:
    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 20480
      learning_rate: 2.0e-4
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000
    keep_checkpoints: 5
