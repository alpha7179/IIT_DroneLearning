# evader_s2_selfplay_template.yaml
# Stage2 (M3): Self-Play / Opponent Pool 기반 경쟁 학습
# 목표: survival_rate ≥ 60% (RL 추격자 상대), 상대 정책 변화에 robustness
#
# 주의:
#   - Pursuer 담당 박재현과 ml-agents self-play 설정 합의 필요
#   - 양쪽 에이전트가 동일 환경 파일에서 학습해야 함
#   - self_play.team_id로 Evader/Pursuer 팀 구분
#
# 실행 (Stage1 체크포인트에서 warm-start):
#   mlagents-learn python/config/evader_s2_selfplay_template.yaml \
#     --run-id=evader_s2_selfplay_seed42 \
#     --initialize-from=evader_s1_base_seed42 \
#     --force

behaviors:
  EvaderAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 20480
      learning_rate: 1.5e-4    # Self-play는 더 낮은 LR로 안정화
      beta: 2.0e-3             # 엔트로피 추가 감소
      epsilon: 0.15            # PPO 클리핑 축소 (안정화)
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    # ── Self-Play 설정 ─────────────────────────────────────────────────
    self_play:
      save_steps: 50000          # 상대 스냅샷 저장 주기
      team_change: 100000        # 팀 전환 주기
      swap_steps: 2000           # 상대 정책 교체 주기 (에피소드 단위)
      window: 10                 # 최근 N개 스냅샷 중 랜덤 선택
      play_against_latest_model_ratio: 0.5  # 최신 vs 스냅샷 비율
      initial_elo: 1200          # ELO 초기값

    max_steps: 2000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000
    keep_checkpoints: 10         # Self-play는 더 많은 체크포인트 보관

# ============================================================
# Stage2 보상 함수 가이드라인
#
# Stage1 대비 변경:
#   _occlusionBonus = 0.005 (선택 — 활성화 시 효과 모니터링 필수)
#   LOS 차단이 숨기만 하는 국소 최적 유발 시 즉시 0으로 복구
#
# Self-play 안정화 팁:
#   - 한쪽이 압도적이면 swap_steps를 줄여 다양한 상대 경험 확보
#   - ELO가 극단적으로 벌어지면 window 크기를 늘려 다양한 스냅샷 사용
# ============================================================
