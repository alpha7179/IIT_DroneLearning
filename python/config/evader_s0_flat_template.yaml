# evader_s0_flat_template.yaml
# Stage0: flat env (Stage0_Flat.unity), goal-reach only
#   - No obstacles, no Pursuer (_goalOnlyMode = true)
#   - Obs: VectorObs 18 + DroneSensorSystem 26 = 44 total
#   - Target: goal_reach_rate >= 50%
#
# Unity Inspector:
#   EvaderAgent._goalOnlyMode      = true
#   EvaderAgent._pursuerTransform  = (empty)
#   BehaviorParameters.Behavior Name        = Drone_Evader
#   BehaviorParameters.Continuous Actions   = 4
#   BehaviorParameters.Vector Obs Size      = 44
#   DecisionRequester.Decision Period       = 5
#
# Run (local):
#   mlagents-learn python/config/evader_s0_flat_template.yaml \
#     --run-id=evader_s0_flat_44d_v2_seed42 --force

behaviors:
  Drone_Evader:
    trainer_type: ppo

    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 500000
    time_horizon: 64
    summary_freq: 5000
    checkpoint_interval: 50000
    keep_checkpoints: 5

# Reward structure (EvaderReward.cs):
#   step   = goalShapingCoeff(0.1) * (d_prev - d_now)
#          + yawAlignCoeff(0.05) * dot(forward, toGoal)
#          + timePenaltyPerStep(-0.001)
#   end    = goal reached: +1.0 / captured: -1.0 / crash: -1.0
#
# Convergence (TensorBoard):
#   Cumulative Reward > 0.5 stable
#   Episode Length decreasing
#   -> goal_reach_rate >= 50% -> move to Stage1
