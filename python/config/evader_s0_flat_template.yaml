# evader_s0_flat_template.yaml
# Stage0: flat env (Stage0_Flat.unity), goal-reach only
#   - No obstacles, no Pursuer (_goalOnlyMode = true)
#   - Target: goal_reach_rate >= 50%
#
# Unity Inspector:
#   EvaderAgent._goalOnlyMode      = true
#   EvaderAgent._pursuerTransform  = (empty)
#   EvaderAgent._goalTransform     = GoalZone
#   BehaviorParameters.Behavior Name        = EvaderAgent
#   BehaviorParameters.Continuous Actions   = 4
#   BehaviorParameters.Vector Obs Size      = 18
#   DecisionRequester.Decision Period       = 5
#
# Run (local):
#   mlagents-learn python/config/evader_s0_flat_template.yaml \
#     --run-id=evader_s0_flat_seed42 --force

behaviors:
  EvaderAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 6400
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 300000
    time_horizon: 64
    summary_freq: 5000
    checkpoint_interval: 30000
    keep_checkpoints: 5

# Reward structure (EvaderReward.cs):
#   step   = goalShapingCoeff(0.02) * (d_prev - d_now)
#          + survivalRewardPerStep(+0.001)
#          + timePenaltyPerStep(-0.001)
#   end    = goal reached: +1.0 / timeout: +0.2
#
# Convergence (TensorBoard):
#   Cumulative Reward > 0.5 stable
#   Episode Length decreasing
#   -> goal_reach_rate >= 50% -> move to Stage0-B
