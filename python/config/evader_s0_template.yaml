# evader_s0_template.yaml
# Stage0: Ray + 힌트 허용, 장애물 거의 없는 환경
# 목표: catch_rate ≥ 70%, survival_rate ≥ 70% (고정 시드 기준)
# 복사하여 날짜와 실험 설명을 파일명에 추가할 것
# 예: evader_s0_20260310_base.yaml
#
# 실행: mlagents-learn python/config/evader_s0_template.yaml --run-id=evader_s0_template_seed42 --force

behaviors:
  EvaderAgent:
    trainer_type: ppo

    hyperparameters:
      # --- 핵심 PPO 파라미터 ---
      batch_size: 64          # buffer_size의 1/6~1/10 권장
      buffer_size: 9600       # 에피소드 길이 * 환경 수 기준 조정
      learning_rate: 3.0e-4   # 초기값; 불안정 시 1.0e-4로 낮출 것
      beta: 5.0e-3            # 엔트로피 계수 (탐색 유도); 안정화 후 1.0e-3으로 감소
      epsilon: 0.2            # PPO 클리핑; 안정화 후 0.1로 축소
      lambd: 0.99             # GAE lambda
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true         # 관측 정규화 필수 (위치/속도 스케일 차이 보정)
      hidden_units: 256
      num_layers: 2
      # vis_encode_type: simple  # 비전 추가 시 주석 해제

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      # curiosity:             # 탐색 부족 시 주석 해제
      #   strength: 0.02
      #   gamma: 0.99

    # --- 종료/타임아웃 ---
    max_steps: 500000         # Stage0 기준; Stage별로 증가
    time_horizon: 64          # 에피소드 평균 길이보다 짧게 설정
    summary_freq: 10000       # TensorBoard 기록 주기

    # --- 체크포인트 ---
    checkpoint_interval: 50000
    keep_checkpoints: 5

    # --- 평가 ---
    # threaded: true          # 다중 환경 사용 시 주석 해제

# 학습 환경 설정 (Unity 실행 파일 경로는 실행 시 --env로 지정)
# 예: mlagents-learn ... --env=Build/EvaderEnv.exe --num-envs=4

# ============================================================
# 보상 함수 가이드라인 (Unity C# 측에서 구현)
# R_total = w1*R_goal + w2*R_survival + w3*R_occlusion + w4*R_collision + w5*R_time
#
# Stage0 권장 초기값:
#   R_goal (목표 도달 보너스):   +1.0
#   R_goal (거리 shaping):      +0.02 * (d_prev - d_now) [potential-based]
#   R_survival (생존 보너스):   +0.001 / step
#   R_occlusion (LOS 차단):     0 (Stage0에서는 비활성)
#   R_collision (충돌 페널티):  -1.0 (즉시 종료)
#   R_time (시간 페널티):       -0.001 / step
#   R_captured (포획 페널티):   -1.0 (즉시 종료)
# ============================================================
