name: Deploy Static Web to GitHub Pages

on:
  push:
    branches:
      - work/evader
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate static web root
        run: |
          test -f web/index.html
          test -f web/system/index.html
          test -f web/analysis/index.html
          test -f web/evader/index.html
          test -f web/pursuer/index.html
          test -f web/unity/index.html
          test -f web/roadmap/index.html
          test -f web/team/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
